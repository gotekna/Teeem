name: Deploy Backend Staging (Rob's Branch) to Heroku

on:
  push:
    branches:
      - rob
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-staging.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full history for git subtree

      - name: Setup Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
          heroku --version

      - name: Deploy backend to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: teeemlive
        run: |
          # Configure git user (required for subtree split)
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"

          # Create backend-only branch using subtree split
          git subtree split --prefix backend -b backend-deploy

          # Add Heroku remote directly using git URL with API key
          git remote add heroku https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git

          # Push to Heroku
          git push heroku backend-deploy:main --force

          # Clean up temporary branch
          git branch -D backend-deploy

      - name: Check deployment status
        if: success()
        run: |
          echo "✅ Backend deployed to Heroku successfully"
          echo "🔗 Backend URL: https://teeemlive-ce8e2660a615.herokuapp.com/"
          echo "📊 View logs: heroku logs --tail --app teeemlive"
