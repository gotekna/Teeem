    <path d="M40 8L8 34V76H28V56H52V76H72V34L40 8Z" fill="#0E7490" stroke="#0E7490" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Roof accent -->
    <path d="M40 8L8 34H72L40 8Z" fill="#0891B2"/>
    <!-- Door -->
    <rect x="33" y="56" width="14" height="20" rx="1.5" fill="white" opacity="0.9"/>
    <!-- Windows -->
    <rect x="48" y="38" width="12" height="12" rx="1.5" fill="white" opacity="0.7"/>
    <rect x="20" y="38" width="12" height="12" rx="1.5" fill="white" opacity="0.7"/>
    <!-- Accessibility icon -->
    <circle cx="40" cy="63" r="5" fill="#0E7490" stroke="white" stroke-width="2"/>
    <circle cx="40" cy="60.5" r="1.5" fill="white"/>
    <path d="M38.5 62V65.5H42L43.5 68" stroke="white" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Text centered -->
  <text x="100" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#0F172A" letter-spacing="-0.5">
