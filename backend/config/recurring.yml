# ============================================
# SOLID QUEUE RECURRING TASKS - Single Source of Truth
# ============================================
# All recurring jobs are defined here.
# This is the ONLY config file for recurring tasks.
#
# IMPORTANT: SolidQueue 1.1.0+ expects recurring tasks
# in a separate file (config/recurring.yml), not in queue.yml
#

# ============================================
# SYSTEM MAINTENANCE
# ============================================
clear_solid_queue_finished_jobs:
  command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
  schedule: every hour at minute 12

# Monitor database connection pool usage (Option C refactor)
# Detects exhaustion BEFORE failures - other jobs check cache to skip if critical
connection_health_monitor:
  class: ConnectionHealthMonitorJob
  queue: low
  schedule: every 5 minutes

# ============================================
# TOKEN REFRESH (every 15 minutes)
# Proactively refresh OAuth tokens before expiry
# Uses 15-minute buffer to catch expirations early
# ============================================
refresh_integration_tokens:
  class: RefreshIntegrationTokensJob
  queue: default
  schedule: every 15 minutes

# ============================================
# EMAIL SYNC (every 10-15 minutes)
# ============================================
# DISABLED - All email sync jobs disabled per Sam's request
# email_warehouse_sync:
#   class: EmailWarehouseSyncAllJob
#   queue: default
#   schedule: every 10 minutes

# process_new_job_emails:
#   class: ProcessNewJobEmailsJob
#   queue: default
#   schedule: every 10 minutes

# Organization-wide Microsoft email sync
# org_email_sync:
#   class: OrgEmailSyncJob
#   queue: low
#   schedule: every 15 minutes

# ============================================
# XERO INTEGRATION
# ============================================
# SSoT: Xero sync is LIVE via webhooks (configured 2025-12-18)
# Webhooks handle: Contacts, Invoices, Billing subscriptions
# URL: https://teeemlive-ce8e2660a615.herokuapp.com/api/v1/xero/webhooks
# ============================================

# REMOVED (2025-12-18): Scheduled syncs replaced by live webhooks
# - xero_invoice_incremental_sync (was: every 30 minutes)
# - xero_contact_sync (was: every 30 minutes)

# SELF-HEALING: Health monitor catches any webhook failures
# Runs less frequently now that webhooks are primary
xero_health_monitor:
  class: XeroHealthMonitorJob
  queue: default
  schedule: every 2 hours

# Bank transaction sync (no webhook available for bank transactions)
xero_bank_transaction_sync:
  class: XeroBankTransactionSyncJob
  queue: low
  schedule: every 6 hours at minute 30

# Cleanup stale Xero external links (7+ days old)
# Removes links to archived/deleted Xero contacts after grace period
cleanup_stale_xero_links:
  class: CleanupStaleXeroLinksJob
  queue: low
  schedule: at 3am every day

# ============================================
# DATA WAREHOUSE RECURRING JOBS
# ============================================

# Fast views refresh hourly (concurrent-safe, no table locks)
# Only refreshes: mv_job_summary, mv_job_document_status, mv_invoice_po_reconciliation
warehouse_refresh_views_fast:
  class: RefreshMaterializedViewsJob
  queue: low
  args: ["fast"]
  schedule: every hour at minute 5

# Full views refresh daily at 2am Brisbane (off-peak)
# Refreshes all 12 views including slow financial summaries
warehouse_refresh_views_full:
  class: RefreshMaterializedViewsJob
  queue: low
  args: ["all"]
  schedule: at 2am every day

# Capture daily job snapshots (for historical trends)
warehouse_daily_snapshot:
  class: DailyJobSnapshotJob
  queue: low
  schedule: at 2am every day

# Sync Xero invoice attachments (PDFs) - runs after invoice sync
warehouse_xero_attachments:
  class: XeroAttachmentSyncJob
  queue: low
  args: [null, { limit: 50 }]
  schedule: every 2 hours at minute 45

# Upload Xero PDFs to SharePoint - catches any that failed instant upload
# SSoT: Instant upload happens in XeroAttachmentSyncService.upload_to_sharepoint
# This backfill catches failures and runs frequently to stay near-live
warehouse_sharepoint_upload:
  class: XeroSharepointUploadBackfillJob
  queue: low
  args: [{ limit: 50, dry_run: false }]
  schedule: every 30 minutes

# SSoT Health Monitor - DISABLED (job removed, depends on unmigrated table)
# xero_sync_health_monitor:
#   class: XeroSyncHealthMonitorJob
#   queue: default
#   schedule: every 5 minutes

# Batch document verification (AI classification)
warehouse_document_verification:
  class: BatchDocumentVerificationJob
  queue: low
  args: [{ limit: 25 }]
  schedule: every 4 hours at minute 30

# Sync job documents from OneDrive to database (data warehouse)
# Moved from every 6h to daily 3am off-peak to avoid blocking worker threads
warehouse_job_documents_sync:
  class: JobDocumentSyncJob
  queue: low
  schedule: at 3am every day

# ============================================
# ACCOUNTS PAYABLE - BILL INBOX
# ============================================

# Monitor Pay@tekna.com.au for incoming invoices
bill_inbox_sync:
  class: BillInboxSyncJob
  queue: default
  schedule: every 15 minutes

# ============================================
# BPMN WORKFLOW TASKS
# ============================================

# Send reminder notifications for tasks due soon or overdue
bpmn_due_date_reminders:
  class: BpmnDueDateReminderJob
  queue: default
  schedule: every 2 hours

# ============================================
# EMAIL MAINTENANCE
# ============================================

# Clean up expired ephemeral emails daily (GitHub notifications, calendar, etc.)
cleanup_ephemeral_emails:
  class: CleanupEphemeralEmailsJob
  queue: low
  args: [{ dry_run: false, delete_from_outlook: true }]
  schedule: at 3am every day

# Sync IMAP email accounts (unified inbox)
imap_email_sync:
  class: ImapSyncJob
  queue: default
  schedule: every 15 minutes

# ============================================
# FOUNDATION SYSTEM HEALTH
# ============================================

# Daily health check - runs all health checks, auto-fixes issues, and caches results
# Runs at 6am Brisbane time to populate cache for instant health dashboard loading
daily_health_check:
  class: DailyHealthCheckJob
  queue: low
  schedule: at 6am every day

# Monitor Foundation metadata sync (detect drift between DB schema and Foundation columns)
# Sends alerts if columns are missing from Foundation system
foundation_sync_monitor:
  class: FoundationSyncMonitorJob
  queue: low
  schedule: at 4am every day

# ============================================
# WEATHER MONITORING
# ============================================

# Auto-detect rainfall for all active jobs and create rain log entries
# Runs at 5am Brisbane time when yesterday's weather data is fully available
check_yesterday_rain:
  class: CheckYesterdayRainJob
  queue: low
  schedule: at 5am every day

# ============================================
# PLAN UPLOADS MAINTENANCE
# ============================================

# Clean up orphaned staging files from failed plan uploads
# Runs daily at 4am to delete staging files older than 24 hours
plan_staging_cleanup:
  class: PlanStagingCleanupJob
  queue: low
  schedule: at 4am every day
