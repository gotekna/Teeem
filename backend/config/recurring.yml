# ============================================
# SOLID QUEUE RECURRING TASKS - Single Source of Truth
# ============================================
# All recurring jobs are defined here.
# This is the ONLY config file for recurring tasks.
#
# IMPORTANT: SolidQueue 1.1.0+ expects recurring tasks
# in a separate file (config/recurring.yml), not in queue.yml
#

# ============================================
# SYSTEM MAINTENANCE
# ============================================
clear_solid_queue_finished_jobs:
  command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
  schedule: every hour at minute 12

# Monitor database connection pool usage (Option C refactor)
# Detects exhaustion BEFORE failures - other jobs check cache to skip if critical
# FRC (Feb 2026): Reduced from 5 to 15 min - pool check doesn't need high frequency
connection_health_monitor:
  class: ConnectionHealthMonitorJob
  queue: low
  schedule: every 15 minutes

# ============================================
# PERFORMANCE OBSERVATORY
# Zero-impact performance monitoring for API requests and Web Vitals
# ============================================
# Flush performance metrics from memory buffer to database
# FRC (Feb 2026): Reduced from 5 to 15 min - buffer auto-flushes at 80% capacity
flush_performance_buffer:
  class: FlushPerformanceBufferJob
  queue: low
  schedule: every 15 minutes

# Cleanup old performance data (90+ days retention)
# Runs daily at 4am Brisbane time (off-peak)
cleanup_performance_data:
  class: CleanupPerformanceDataJob
  queue: low
  schedule: every day at 4:00 am

# Refresh materialized views and run anomaly detection
# Views pre-aggregate metrics for fast dashboard queries
# FRC (Feb 2026): Reduced from 5 to 15 min - dashboard stats not time-critical
refresh_performance_mv:
  class: RefreshPerformanceMvJob
  queue: low
  schedule: every 15 minutes

# Calculate SLO snapshots and error budgets daily
# Runs at 1am to ensure previous day's data is complete
calculate_slo_snapshots:
  class: CalculateSloSnapshotsJob
  queue: low
  schedule: every day at 1:00 am

# ============================================
# TOKEN REFRESH (every 15 minutes)
# Proactively refresh OAuth tokens before expiry
# Uses 15-minute buffer to catch expirations early
# ============================================
refresh_integration_tokens:
  class: RefreshIntegrationTokensJob
  queue: default
  schedule: every 15 minutes

# ============================================
# EMAIL SYNC - Org-wide via app permissions
# ============================================
# Syncs ALL mailboxes for ALL connected MS365 organizations.
# Dispatcher job iterates all credentials and enqueues OrgEmailSyncJob for each.
# FRC (Feb 2026): Moved from :default to :email_sync queue.
# Root cause: OrgEmailSyncJob is long-running (10-30 min per org). When dispatched
# on :default, all 5 threads would be consumed by email sync, starving health monitors
# and recurring tasks for 2+ hours. On :email_sync (lower priority than default),
# health monitors always get a thread first.
# Reverted to 15 min (Feb 2026): Pilgrim Homes backfill complete.
# With DeduplicatableJob and 14-min time budget, 5 min schedule just created skipped queue entries.
all_orgs_email_sync:
  class: AllOrgsEmailSyncJob
  queue: email_sync
  schedule: every 15 minutes

# ============================================
# XERO INTEGRATION
# ============================================
# SSoT: Xero sync is LIVE via webhooks (configured 2025-12-18)
# Webhooks handle: Contacts, Invoices, Billing subscriptions
# URL: https://teeemlive-ce8e2660a615.herokuapp.com/api/v1/xero/webhooks
# ============================================

# SSoT: Webhooks are PRIMARY for invoice/contact sync
# But webhooks can fail, so we need scheduled BACKUP syncs

# BACKUP: Contact sync - catches webhook failures
# FRC (Feb 2026): Webhooks-only left contacts stale for 13+ hours when webhooks failed.
# This runs every 15 minutes as a safety net. The XeroContactSyncJob is idempotent.
xero_contact_sync_backup:
  class: XeroContactSyncJob
  queue: xero_sync
  schedule: every 15 minutes

# SELF-HEALING: Health monitor catches sync failures and triggers recovery
# FRC (Feb 2026): Increased frequency from 15 to 5 minutes for faster self-healing
# Invoices run every 5 min, so health monitor should be at least as frequent
# - Clears orphaned jobs blocking self-heal
# - Clears stale batch locks
# - Triggers stalled syncs (pdfs, invoices, contacts)
# - Logs comprehensive health metrics for visibility
xero_health_monitor:
  class: XeroHealthMonitorJob
  queue: xero_sync
  schedule: every 5 minutes

# Bank transaction sync (no webhook available for bank transactions)
xero_bank_transaction_sync:
  class: XeroBankTransactionSyncJob
  queue: xero_sync
  schedule: every 6 hours at minute 30

# Cleanup stale Xero external links (7+ days old)
# Removes links to archived/deleted Xero contacts after grace period
cleanup_stale_xero_links:
  class: CleanupStaleXeroLinksJob
  queue: low
  schedule: at 3am every day

# Corporate company Xero data sync (monthly P&L, accounts, invoices)
# Syncs to local database for fast access - runs daily at 6am
corporate_xero_data_sync:
  class: CorporateXeroSyncJob
  queue: low
  schedule: at 6am every day

# Auto-match Xero bills to native POs and update Xero Reference field
# Finds Xero-imported POs, matches to manual POs by supplier+amount,
# then writes PO number (e.g. PO-002452) to Xero bill's Reference field.
# Runs daily at 7am Brisbane time (after overnight syncs, before work starts)
xero_bill_po_match:
  class: XeroBillPoMatchJob
  queue: xero_sync
  schedule: at 7am every day

# GL Backup Sync - catches any webhook failures
# SSoT: Webhooks are primary for GL sync, this is BACKUP only
# Syncs tenants that are stale (>4 hours since last sync)
gl_sync_backup:
  class: GlSyncBackupJob
  queue: low
  schedule: every 6 hours at minute 15

# Pre-warm Xero sync stats cache for dashboard performance
# Part of "Scale Xero Sync to 15k" plan (Phase 3)
# FRC (Feb 2026): Reduced from 5 to 15 min - cache prewarm, not urgent
refresh_xero_stats_cache:
  class: RefreshXeroStatsCacheJob
  queue: low
  schedule: every 15 minutes

# Refresh mv_xero_sync_stats materialized view for O(1) queries
# Part of "Scale Xero Sync to 15k" plan (Phase 4)
# FRC (Feb 2026): Reduced from 5 to 15 min - MV refresh not urgent
refresh_xero_stats_mv:
  class: RefreshXeroStatsMvJob
  queue: low
  schedule: every 15 minutes

# ============================================
# CORPORATE FINANCIAL REPORTS
# ============================================
# Monthly P&L and Balance Sheet generation for all Xero-connected companies
# Runs on the 1st of each month at 4am Brisbane time
# Stores data in profit_loss_reports and balance_sheet_reports tables
# Also uploads PDF reports to SharePoint

corporate_financial_reports_monthly:
  class: CorporateFinancialReportsJob
  queue: low
  schedule: every month on the 1st at 4am

# ============================================
# RECURRING INVOICES (T.A.S.)
# ============================================
# Daily generation of recurring invoices that are due
# Runs at 6am Brisbane time to generate invoices for the day
# Auto-approves if configured, sends email notifications
recurring_invoice_generation:
  class: RecurringInvoiceGenerationJob
  queue: default
  schedule: at 6am every day

# ============================================
# SCHEDULED INVOICES (T.A.S.)
# ============================================
# Process invoices scheduled for future delivery
# Runs every 15 minutes to check for due invoices
# Sends email if send_email flag is set
process_scheduled_invoices:
  class: ProcessScheduledInvoicesJob
  queue: default
  schedule: every 15 minutes

# ============================================
# SCHEDULED EMAILS
# ============================================
# Process emails scheduled for future delivery
# Runs every 5 minutes to check for due emails
process_scheduled_emails:
  class: ProcessScheduledEmailsJob
  queue: default
  schedule: every 5 minutes

# ============================================
# SCHEDULED REPORTS (T.A.S.)
# ============================================
# Auto-generate and email reports (P&L, Balance Sheet, etc.)
# Runs every hour to check for due report schedules
# Supports daily, weekly, monthly, and quarterly frequencies
process_scheduled_reports:
  class: ProcessScheduledReportsJob
  queue: low
  schedule: every hour at minute 5

# ============================================
# ASSET REGISTER (World-Class Asset Management)
# ============================================
# Monthly depreciation calculation for all assets
# Runs on the 1st of each month at 3am Brisbane time
# Calculates book and tax depreciation for current financial year
asset_depreciation_monthly:
  class: AssetDepreciationMonthlyJob
  queue: low
  schedule: every month on the 1st at 3am

# Monthly depreciation journal posting to Xero
# Runs on the 5th of each month at 6am (after calculations are complete)
# Posts manual journals: Debit Depreciation Expense, Credit Accumulated Depreciation
asset_depreciation_journals_monthly:
  class: AssetDepreciationJournalJob
  queue: low
  schedule: every month on the 5th at 6am

# Daily insurance expiry check
# Sends notifications for assets with expiring or expired insurance
asset_insurance_expiry_check:
  class: AssetInsuranceExpiryJob
  queue: low
  schedule: at 7am every day

# ============================================
# DATA WAREHOUSE RECURRING JOBS
# ============================================

# Fast views refresh hourly (concurrent-safe, no table locks)
# Only refreshes: mv_job_summary, mv_job_document_status, mv_invoice_po_reconciliation
warehouse_refresh_views_fast:
  class: RefreshMaterializedViewsJob
  queue: low
  args: ["fast"]
  schedule: every hour at minute 5

# Full views refresh daily at 2am Brisbane (off-peak)
# Refreshes all 12 views including slow financial summaries
warehouse_refresh_views_full:
  class: RefreshMaterializedViewsJob
  queue: low
  args: ["all"]
  schedule: at 2am every day

# Capture daily job snapshots (for historical trends)
warehouse_daily_snapshot:
  class: DailyJobSnapshotJob
  queue: low
  schedule: at 2am every day

# Self-healing: Repair bills with empty line_items
# FRC (Feb 2026): Original sync fetched summary data (no LineItems).
# Pagination fix prevents new gaps. This repairs existing ones surgically.
# Fetches 30 invoices/run individually from Xero API.
# Self-disabling: exits immediately when no repairs needed.
xero_invoice_repair:
  class: XeroInvoiceRepairJob
  queue: xero_sync
  args: [{}]
  schedule: every 30 minutes

# Sync Xero invoice data from Xero API to database
# Safety net: webhooks handle real-time updates, this catches anything missed
# Reduced from 5min to 15min (Feb 2026) since webhooks + single-invoice path
# handle the real-time case. This is backup only.
xero_invoice_data_sync:
  class: XeroInvoiceSyncJob
  queue: xero_sync
  args: [{}]
  schedule: every 15 minutes

# Sync Xero invoice attachments (PDFs) - runs frequently for backfill
# Syncs invoices to WarehouseDocument (SSoT for all documents)
# FRC (Feb 2026): Was every 2 hours - too slow for 4000+ PDF backfill
# Changed to every 10 minutes with self-healing batch lock
warehouse_xero_attachments:
  class: XeroAttachmentSyncJob
  queue: xero_bulk
  args: [null, { limit: 50 }]
  schedule: every 10 minutes

# NOTE: XeroStorageUploadBackfillJob was removed in Jan 2026 refactor
# Storage upload now happens inline in XeroAttachmentSyncService

# Sync missing warehouse entries for task attachments
# SSoT: SmTaskAttachment.after_create should create entries automatically,
# but this catches any that slip through (race conditions, failed callbacks)
# Runs weekly on Sundays at 5am (after backups, before work week)
warehouse_sync_task_attachments:
  class: SyncTaskAttachmentsJob
  queue: low
  schedule: every Sunday at 5am

# SSoT Health Monitor - DISABLED (job removed, depends on unmigrated table)
# xero_sync_health_monitor:
#   class: XeroSyncHealthMonitorJob
#   queue: default
#   schedule: every 5 minutes

# ============================================
# ACCOUNTS PAYABLE - BILL INBOX
# ============================================

# Monitor Pay@tekna.com.au for incoming invoices
bill_inbox_sync:
  class: BillInboxSyncJob
  queue: default
  schedule: every 15 minutes

# ============================================
# BPMN WORKFLOW TASKS
# ============================================

# Send reminder notifications for tasks due soon or overdue
bpmn_due_date_reminders:
  class: BpmnDueDateReminderJob
  queue: default
  schedule: every 2 hours

# ============================================
# EMAIL MAINTENANCE
# ============================================

# Clean up expired ephemeral emails daily (GitHub notifications, calendar, etc.)
cleanup_ephemeral_emails:
  class: CleanupEphemeralEmailsJob
  queue: low
  args: [{ dry_run: false, delete_from_outlook: true }]
  schedule: at 3am every day

# Clean up emails marked as content_unavailable (deleted from O365/Gmail by user)
# FRC (Jan 2026): When user deletes email from mailbox, sync marks it unavailable.
# This job removes the now-useless records from our database.
# Runs daily at 3:30am (after ephemeral cleanup)
cleanup_unavailable_emails:
  class: CleanupUnavailableEmailsJob
  queue: low
  args: [{ dry_run: false, batch_size: 500 }]
  schedule: at 3:30am every day

# Sync IMAP email accounts (unified inbox)
# FRC (Feb 2026): Increased from 2 to 5 min - IMAP doesn't need 2-min polling
imap_email_sync:
  class: ImapSyncJob
  queue: default
  schedule: every 5 minutes

# SELF-HEALING: Email health monitor
# Detects stale syncs, cleans orphaned jobs, triggers recovery
# Runs every 5 minutes for responsive self-healing
email_health_monitor:
  class: EmailHealthMonitorJob
  queue: default
  schedule: every 5 minutes

# Upload synced emails to Wasabi storage (self-healing)
# FRC (Jan 2026): Auto-recovers from queue DB connection failures
# Auto-discovers all tenants with pending emails (no manual tenant_id needed)
# FRC (Feb 2026): batch_size 500→100. 500 MIME contents in memory (50MB+)
# plus OrgEmailSync running concurrently = 1.9GB on 1GB dyno (R14 crash).
# 100 per iteration × auto-continue loop = same throughput, 5x less peak memory.
# FRC (Feb 2026): Moved to :low - blob uploads are background work, frees :default for sync
email_storage_upload:
  class: UploadEmailsToStorageJob
  queue: low
  args: [{ batch_size: 100 }]
  schedule: every 5 minutes

# Upload IMAP emails to Wasabi storage (parallel to MS365 upload above)
# IMAP emails use uid + folder_name to fetch raw .eml from IMAP server
# FRC (Feb 2026): Was a one-off backfill job, now recurring to handle new IMAP emails
# FRC (Feb 2026): Moved to :low - blob backfill is background work, frees :default for sync
imap_email_storage_upload:
  class: BackfillImapEmailBlobsJob
  queue: low
  args: [{ batch_size: 100 }]
  schedule: every 5 minutes

# Retry pending attachment blob downloads (self-healing)
# FRC (Feb 2026): Two-step sync creates metadata in step 1 but step 2 (blob download)
# can fail silently. This job retries those orphaned attachments every 15 minutes.
retry_pending_attachment_blobs:
  class: RetryPendingAttachmentBlobsJob
  queue: default
  args: [{ batch_size: 50 }]
  schedule: every 15 minutes

# Note: BackfillEmailAttachmentBlobsJob removed (Jan 2026) - EmailAttachment table dropped
# Email attachments now stored directly in WarehouseDocument with source_type='email_attachment'

# Wake up snoozed emails that have reached their snooze time
# FRC (Feb 2026): Reduced from 5 to 15 min - 15-min snooze granularity is fine
email_snooze_wakeup:
  class: EmailSnoozeWakeupJob
  queue: default
  schedule: every 15 minutes

# Process email reminders that are due
# FRC (Feb 2026): Reduced from 5 to 15 min - email reminder granularity is fine
email_reminders:
  class: EmailReminderJob
  queue: default
  schedule: every 15 minutes

# ============================================
# DOCSORT - Universal Document Inbox
# ============================================
# DISABLED: DocsortEmailIngestJob class does not exist yet.
# This was crashing workers on both staging and production.
# Re-enable when DocsortEmailIngestJob is implemented.
# docsort_email_ingest:
#   class: DocsortEmailIngestJob
#   queue: default
#   schedule: every 15 minutes

# ============================================
# EMAIL TO JOB / EMAIL TO TASK
# ============================================
# Process emails sent to newjob@tekna.com.au and create job proposals
# Runs every 5 minutes for responsive job creation
# FRC (Feb 2026): Moved to :low - not latency-critical, frees :default for sync
process_new_job_emails:
  class: ProcessNewJobEmailsJob
  queue: low
  schedule: every 5 minutes

# Process emails sent to newtask@tekna.com.au and create tasks
# Runs every 5 minutes for responsive task creation
# FRC (Feb 2026): Moved to :low - not latency-critical, frees :default for sync
process_new_task_emails:
  class: ProcessNewTaskEmailsJob
  queue: low
  schedule: every 5 minutes

# ============================================
# FOUNDATION SYSTEM HEALTH
# ============================================

# Daily health check - runs all health checks, auto-fixes issues, and caches results
# Runs at 6am Brisbane time to populate cache for instant health dashboard loading
daily_health_check:
  class: DailyHealthCheckJob
  queue: low
  schedule: at 6am every day

# Monitor Foundation metadata sync (detect drift between DB schema and Foundation columns)
# Sends alerts if columns are missing from Foundation system
foundation_sync_monitor:
  class: FoundationSyncMonitorJob
  queue: low
  schedule: at 4am every day

# ============================================
# WEATHER MONITORING
# ============================================

# Auto-detect rainfall for all active jobs and create rain log entries
# Runs at 5am Brisbane time when yesterday's weather data is fully available
check_yesterday_rain:
  class: CheckYesterdayRainJob
  queue: low
  schedule: at 5am every day

# ============================================
# PLAN UPLOADS MAINTENANCE
# ============================================

# Clean up orphaned staging files from failed plan uploads
# Runs daily at 4am to delete staging files older than 24 hours
plan_staging_cleanup:
  class: PlanStagingCleanupJob
  queue: low
  schedule: at 4am every day

# ============================================
# STORAGE TEMP FILES MAINTENANCE
# ============================================

# Clean up old TaskResponseZips (7+ days old)
# These accumulate from "Download All Response Files" feature
# Runs daily at 5am to delete expired temp zip files
cleanup_temp_files:
  class: CleanupTempFilesJob
  queue: low
  schedule: at 5am every day

# ============================================
# SCHEDULE MASTER (SM GANTT)
# ============================================

# Daily generation of recurring tasks
# Runs at 6:30am Brisbane time (after rollover, before work starts)
# - Finds all active recurring task definitions due for generation
# - Creates SmTask instances for upcoming dates (advance_days ahead)
# - Skips weekends/holidays/user leave if configured
# - Sends notifications to assignees
sm_recurring_task_generation:
  class: SmRecurringTaskGenerationJob
  queue: default
  schedule: at 6:30am every day

# Send notifications for overdue tasks
# Runs at 8am Brisbane time (after work starts, before standup)
# - Finds tasks with end_date < today that aren't completed
# - Only sends ONE notification per task (won't spam daily)
# - Notifies assigned user
task_overdue_notifications:
  class: TaskOverdueNotificationJob
  queue: default
  schedule: at 8am every day

# Nightly rollover of past-due tasks
# Runs at midnight Brisbane time to:
# - Find all not_started tasks with start_date < today
# - Move them forward to today (preserving duration)
# - Soft-delete broken predecessor dependencies
# - Cascade to affected successor tasks
# - Log all changes to sm_rollover_logs
sm_rollover:
  class: SmRolloverJob
  queue: critical
  schedule: at midnight every day

# ============================================
# SITE PRESENCE & COST INTELLIGENCE
# ============================================
# Photo-verified time tracking with simPRO-style costing
# See: .claude/plans/piped-orbiting-whisper.md

# Generate AI timesheet suggestions for yesterday's work
# Runs at 6am Brisbane time to analyze previous day's sessions/photos
# Creates AiTimesheetSuggestion records for worker review
generate_ai_timesheet_suggestions:
  class: GenerateAiTimesheetSuggestionsJob
  queue: default
  schedule: at 6am every day

# Generate daily progress reports from site photos
# Runs at 7pm Brisbane time to analyze today's work photos
# Uses Claude Vision to detect work completed
generate_daily_progress_report:
  class: GenerateDailyProgressReportJob
  queue: low
  schedule: at 7pm every day

# ============================================
# SAAS CUSTOMER BILLING
# ============================================
# Monthly billing record generation for SaaS customers
# Runs on the 3rd of each month at 6am Brisbane time
# - Creates SaasBillingRecord for each active SaaS customer
# - Calculates tiered fees based on customer turnover
# - Creates ReferralCommission records for L1/L2 referrers
# - Updates network fee caches for eligibility tracking
# - Re-evaluates pending commissions that may now be eligible
monthly_saas_billing:
  class: MonthlySaasBillingJob
  queue: default
  schedule: every month on the 3rd at 6am

# ============================================
# BACKUP JOBS (Backblaze B2)
# ============================================
# Disaster recovery backups to Backblaze B2
# SSoT: BackupStorageService (configured via BACKUP_S3_* env vars)

# Daily document backup - incremental (modified in last day)
# Runs at 2am Brisbane time (off-peak)
document_backup_daily:
  class: DocumentBackupJob
  queue: low
  args: ["daily"]
  schedule: at 2am every day

# Weekly full document backup - catches any missed files
# Runs Sunday 4am Brisbane time (off-peak)
document_backup_weekly:
  class: DocumentBackupJob
  queue: low
  args: ["all"]
  schedule: every Sunday at 4am

# Weekly database backup to Backblaze B2
# Downloads Heroku backup and uploads to B2
# Requires HEROKU_API_KEY env var
# Runs Sunday 3am Brisbane time (before document backup)
database_backup_weekly:
  class: DatabaseBackupJob
  queue: low
  schedule: every Sunday at 3am

# Per-tenant backup dispatcher
# Checks all BackupConfiguration schedules and queues due backups
# Runs every 15 minutes to check tenant-specific schedules
# Enables tenants to have different backup schedules (hourly, daily, weekly)
tenant_backup_dispatcher:
  class: TenantBackupDispatcherJob
  queue: default
  schedule: every 15 minutes

# ============================================
# STORAGE BLOB MAINTENANCE
# ============================================

# Weekly orphan blob audit - safety net for blobs created without WarehouseDocuments
# FRC (Feb 2026): 38 of 39 blob-creating callers bypass WarehouseDocumentCreator,
# creating blobs without WarehouseDocument entries. This catches those orphans.
# Does NOT auto-delete — logs findings for manual review via 'rails blob:cleanup:orphaned'
orphan_blob_audit:
  class: OrphanBlobAuditJob
  queue: low
  args: [{ min_age_days: 7 }]
  schedule: every Sunday at 6am

# ============================================
# SSOT COMPLIANCE
# ============================================

# Weekly Gold Standard compliance audit
# Runs Monday 6am Brisbane time (start of week)
# - Checks all columns match current type definition versions
# - Logs compliance score to system
# - Alerts if score drops below threshold
# Commented out - invalid schedule format crashes worker
# gold_standard_compliance_check:
#   class: GoldStandardComplianceCheckJob
#   queue: low
#   schedule: at 6am on Monday

# ============================================
# AI ASSISTANT - Proactive Monitoring
# ============================================
# Scans for items needing attention: urgent emails, overdue tasks, etc.
# Creates AssistantAlert records for users who have used the assistant recently.
# Only runs for active assistant users (used in last 7 days).
assistant_monitor:
  class: AssistantMonitorJob
  queue: low
  schedule: every 15 minutes

# Batch AI processing for email intelligence (summaries, action items, follow-ups)
# Uses Haiku for cost efficiency (~$1.20/month)
# Processes up to 50 emails per tenant per run
email_intelligence:
  class: EmailIntelligenceJob
  queue: low
  schedule: every 10 minutes

# Morning briefing delivery - personalized daily digest for active users
# Pure SQL aggregation ($0/month). Routes to web + preferred channels.
daily_digest:
  class: DailyDigestJob
  queue: default
  schedule: every day at 6:30am Australia/Brisbane

signal_poll:
  class: SignalPollJob
  queue: low
  schedule: every 30 seconds
