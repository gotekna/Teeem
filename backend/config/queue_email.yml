# ============================================
# EMAIL WORKER QUEUE CONFIGURATION
# ============================================
# Dedicated email sync worker (teeem-email-worker Heroku app).
# Runs on its own Standard-2X dyno (1GB) to prevent memory competition
# with Xero, health monitors, and other jobs.
#
# FRC (Feb 2026): Email sync + Xero jobs sharing 1GB caused R15 crashes
# every 5-10 minutes. Split email sync into its own process so each
# gets a full 1GB budget.
#
# Activated via: SOLID_QUEUE_CONFIG=config/queue_email.yml
# (set on teeem-email-worker Heroku app)
#
# IMPORTANT: No scheduler or recurring tasks here - those stay on
# teeem-shared-worker. This app ONLY processes jobs from the email_sync queue.

production:
  workers:
    # Email worker: sync first, enrichment when idle, uploads lowest priority.
    # FRC (Feb 2026): Reduced from 2 to 1 thread. 2 threads caused R14:
    # AllOrgsEmailSyncJob + UploadEmailsToStorageJob running simultaneously
    # both hold large objects (Graph API responses, MIME content) → combined >1GB.
    # 1 thread serializes work: peak memory = max(single job) ≈ 550-600MB → safe.
    # When scaling for more customers: upgrade to Performance-M (2.5GB) before
    # adding threads back, not the other way around.
    - queues: [email_sync, email_enrichment]
      threads: 1
      processes: 1
      polling_interval: 0.1

  dispatchers:
    - polling_interval: 1
      batch_size: 500

  # Explicitly empty scheduler - prevents SolidQueue from loading recurring.yml
  # All recurring tasks run on teeem-shared-worker only.
  scheduler:
    recurring_tasks: {}

development:
  workers:
    - queues: [email_sync, email_enrichment]
      threads: 2
      processes: 1
      polling_interval: 0.1

  dispatchers:
    - polling_interval: 1
      batch_size: 500

test:
  workers:
    - queues: [email_sync, email_enrichment]
      threads: 1
      processes: 1
      polling_interval: 0.1
