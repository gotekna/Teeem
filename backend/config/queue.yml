# ============================================
# SOLID QUEUE CONFIGURATION
# ============================================
# Queue process config (workers, dispatchers, scheduler).
# Recurring tasks are defined separately in config/recurring.yml
#
# NOTE: YAML anchors/aliases (<<: *default) removed for Psych 5.x compatibility
#
# QUEUE PRIORITY ORDER (first = highest priority):
# - critical: SmRolloverJob, time-sensitive operations
# - default: BPMN workflows, user-triggered jobs, health monitors
# - solid_queue_recurring: SolidQueue's internal recurring task scheduler
# - email_sync: OrgEmailSyncJob, AllOrgsEmailSyncJob (long-running, capped at 3 threads)
# - xero_sync: Xero sync operations (invoice, contact, bank txn, tracking, health)
# - xero_bulk: Xero batch operations (contact batch fetch/process, attachment sync)
# - low: Background analytics, warehouse jobs, email blob uploads, email-to-job/task (can wait)
# - low_priority: Long-running backfill, non-urgent maintenance
#
# FRC (Feb 2026): Split into two worker groups so low-priority bulk jobs
# (MV refresh, backups, email uploads) cannot starve user-facing jobs.
# Previous config had 3 threads on a single worker listening to only 4 queues,
# silently ignoring critical, xero_sync, and low_priority queues entirely.
#
# FRC (Feb 2026): Moved ALL Xero jobs off :default queue onto :xero_sync/:xero_bulk.
# Previously 9 Xero job types were on :default (3 threads) while Worker 2 (6 threads)
# sat idle for those jobs. Now Worker 2 handles all Xero work, freeing Worker 1
# for user-facing operations.
#
# FRC (Feb 2026): Moved OrgEmailSyncJob/AllOrgsEmailSyncJob to :email_sync queue.
# These are long-running (10-30 min per org, syncing 10k+ emails via MS Graph).
# When all 5 default threads ran email sync, health monitors + recurring tasks
# were starved for 2+ hours. Now email_sync is lower priority than default,
# so health monitors always get a thread.

production:
  workers:
    # Priority worker: user-facing + critical operations
    # Handles health monitors, BPMN workflows, recurring task scheduling.
    - queues: [critical, default, solid_queue_recurring]
      threads: 3
      processes: 1
      polling_interval: 0.1

    # Background worker: Xero, analytics, maintenance
    # FRC (Feb 2026): email_sync runs on dedicated teeem-email-worker app
    # via SOLID_QUEUE_CONFIG=config/queue_email.yml (own 1GB dyno).
    # Kept at 3 threads — IO-bound work, fits within 1GB memory budget.
    - queues: [xero_sync, xero_bulk, low, low_priority]
      threads: 3
      processes: 1
      polling_interval: 1

  dispatchers:
    - polling_interval: 1
      batch_size: 500

  scheduler:
    recurring_tasks: config/recurring.yml

development:
  workers:
    - queues: [critical, default, solid_queue_recurring, email_sync, xero_sync, xero_bulk, low, low_priority]
      threads: 3
      processes: 1
      polling_interval: 0.1

  dispatchers:
    - polling_interval: 1
      batch_size: 500

  scheduler:
    recurring_tasks: config/recurring.yml

test:
  workers:
    - queues: [critical, default, solid_queue_recurring, email_sync, xero_sync, xero_bulk, low, low_priority]
      threads: 1
      processes: 1
      polling_interval: 0.1
